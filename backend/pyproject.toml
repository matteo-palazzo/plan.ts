[project]
name = "plants-backend"
version = "1.0.0"
description = "Backend FastAPI per la gestione di una collezione personale di piante"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "pymysql[rsa]",
    "argon2-cffi",
    "python-multipart",
    "apscheduler>=3.10,<4",
    "httpx",
    "tzdata",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
